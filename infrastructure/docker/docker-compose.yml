version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ai-game-studio-postgres
    environment:
      POSTGRES_DB: ai_game_studio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis for caching and task queue
  redis:
    image: redis:7-alpine
    container_name: ai-game-studio-redis
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MinIO for object storage
  minio:
    image: minio/minio
    container_name: ai-game-studio-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # FastAPI Backend
  backend:
    build:
      context: ./
      dockerfile: docker/Dockerfile.backend
    container_name: ai-game-studio-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ai_game_studio
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis:6379/1
      - STORAGE_TYPE=minio
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=ai-game-studio
      - MINIO_USE_SSL=false
      - STRIPE_SECRET_KEY=sk_test_123
      - JWT_SECRET_KEY=your-super-secret-key-change-in-production
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - minio
    restart: unless-stopped

  # Celery Worker
  worker:
    build:
      context: ./
      dockerfile: docker/Dockerfile.worker
    container_name: ai-game-studio-worker
    command: celery -A app.core.celery_app worker -l info -Q celery
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ai_game_studio
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis:6379/1
      - STORAGE_TYPE=minio
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=ai-game-studio
      - MINIO_USE_SSL=false
      - STRIPE_SECRET_KEY=sk_test_123
      - JWT_SECRET_KEY=your-super-secret-key-change-in-production
    depends_on:
      - postgres
      - redis
      - minio
    restart: unless-stopped

  # Flower (Celery monitoring)
  flower:
    image: mher/flower
    container_name: ai-game-studio-flower
    command: flower --broker=redis://redis:6379/0 --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis
    restart: unless-stopped

  # Next.js Web Frontend
  web:
    build:
      context: ./
      dockerfile: docker/Dockerfile.frontend
    container_name: ai-game-studio-web
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data: