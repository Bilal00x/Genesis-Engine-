apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-game-studio-frontend
spec:
  replicas: 4
  template:
    spec:
      containers:
      - name: frontend
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: NEXT_PUBLIC_API_URL
          value: "https://api.aigamestudio.com"
        - name: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
          value: "pk_live_your-production-stripe-publishable-key"