apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ai-game-studio-redis
spec:
  replicas: 3
  template:
    spec:
      containers:
      - name: redis
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        command: ["redis-server", "--save", "60", "1", "--loglevel", "warning", "--maxmemory", "2gb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes", "--appendfsync", "everysec", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--slave-read-only", "no"]
        env:
        - name: REDIS_MAXMEMORY
          value: "2GB"
        - name: REDIS_MAXMEMORY_POLICY
          value: "allkeys-lru"
        - name: REDIS_APPENDONLY
          value: "yes"
        - name: REDIS_APPENDFSYNC
          value: "everysec"
        - name: REDIS_CLUSTER_ENABLED
          value: "yes"
        - name: REDIS_CLUSTER_CONFIG_FILE
          value: "nodes.conf"
        - name: REDIS_CLUSTER_NODE_TIMEOUT
          value: "5000"
        - name: REDIS_SLAVE_READ_ONLY
          value: "no"