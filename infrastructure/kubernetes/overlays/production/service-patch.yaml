apiVersion: v1
kind: Service
metadata:
  name: ai-game-studio-backend
spec:
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  selector:
    app: ai-game-studio
    component: backend
---
apiVersion: v1
kind: Service
metadata:
  name: ai-game-studio-frontend
spec:
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  selector:
    app: ai-game-studio
    component: frontend
---
apiVersion: v1
kind: Service
metadata:
  name: ai-game-studio-minio
spec:
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 9000
      targetPort: 9000
    - protocol: TCP
      port: 9001
      targetPort: 9001
  selector:
    app: ai-game-studio
    component: minio
---
apiVersion: v1
kind: Service
metadata:
  name: ai-game-studio-worker
spec:
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 5555
      targetPort: 5555
  selector:
    app: ai-game-studio
    component: worker