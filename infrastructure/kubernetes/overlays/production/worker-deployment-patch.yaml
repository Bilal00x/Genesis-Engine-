apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-game-studio-worker
spec:
  replicas: 4
  template:
    spec:
      containers:
      - name: worker
        resources:
          requests:
            memory: "1Gi"
            cpu: "1000m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: CELERY_WORKER_CONCURRENCY
          value: "8"