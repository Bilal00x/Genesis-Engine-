apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-game-studio-frontend
  labels:
    app: ai-game-studio
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-game-studio
      component: frontend
  template:
    metadata:
      labels:
        app: ai-game-studio
        component: frontend
    spec:
      containers:
      - name: frontend
        image: your-registry.ai-game-studio/frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "https://api.aigamestudio.com"
        - name: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
          valueFrom:
            secretKeyRef:
              name: ai-game-studio-secrets
              key: stripe-publishable-key
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai-game-studio-frontend
  labels:
    app: ai-game-studio
    component: frontend
spec:
  selector:
    app: ai-game-studio
    component: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP