apiVersion: v1
kind: Secret
metadata:
  name: ai-game-studio-secrets
type: Opaque
stringData:
  database-url: "postgresql://postgres:your-postgres-password@ai-game-studio-postgres:5432/ai_game_studio"
  redis-url: "redis://ai-game-studio-redis:6379/0"
  redis-cache-url: "redis://ai-game-studio-redis:6379/1"
  postgres-password: "your-postgres-password"
  aws-access-key-id: "your-aws-access-key-id"
  aws-secret-access-key: "your-aws-secret-access-key"
  aws-s3-bucket: "ai-game-studio-prod"
  stripe-secret-key: "sk_test_your-stripe-secret-key"
  stripe-publishable-key: "pk_test_your-stripe-publishable-key"
  jwt-secret-key: "your-super-secret-jwt-key-change-in-production"
  minio-root-user: "minioadmin"
  minio-root-password: "your-minio-password"
  smtp-host: "smtp.gmail.com"
  smtp-port: "587"
  smtp-user: "your-email@gmail.com"
  smtp-password: "your-email-password"
  email-from: "noreply@aigamestudio.com"