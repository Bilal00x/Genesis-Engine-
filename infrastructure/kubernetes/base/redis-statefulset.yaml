apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ai-game-studio-redis
  labels:
    app: ai-game-studio
    component: redis
spec:
  serviceName: "ai-game-studio-redis"
  replicas: 1
  selector:
    matchLabels:
      app: ai-game-studio
      component: redis
  template:
    metadata:
      labels:
        app: ai-game-studio
        component: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        command: ["redis-server", "--save", "60", "1", "--loglevel", "warning", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: redis-data
          mountPath: /data
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ai-game-studio-redis
  labels:
    app: ai-game-studio
    component: redis
spec:
  selector:
    app: ai-game-studio
    component: redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
  type: ClusterIP